<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="Consolas, 'DejaVu Sans Mono', monospace">
  <rect width="720" height="340" rx="16" fill="#05070a"/>
  <!-- board outline -->
  <rect x="30" y="30" width="400" height="280" rx="18" fill="#1b1f26" stroke="#3a414c" stroke-width="2"/>
  <!-- screen -->
  <rect x="55" y="50" width="350" height="200" rx="4" fill="#000" stroke="#2a3a40"/>
  <polyline points="60,215 90,190 115,205 140,160 165,200 200,200 230,175 255,210 285,185 330,185 355,150 380,195 400,180"
            fill="none" stroke="#9ff" stroke-width="2"/>
  <line x1="165" y1="200" x2="200" y2="200" stroke="#fff" stroke-width="3"/>
  <line x1="285" y1="185" x2="330" y2="185" stroke="#fff" stroke-width="3"/>
  <g transform="translate(230,115)" stroke="#fff" stroke-width="2" fill="none">
    <path d="M-6,-4 L-6,-9 L-3,-13 L3,-13 L6,-9 L6,-4 Z"/>
    <rect x="-8" y="-4" width="16" height="7"/>
    <path d="M-7,1 L-11,10 M7,1 L11,10 M-14,10 L-8,10 M8,10 L14,10"/>
    <path d="M-3,7 L0,22 L3,7" stroke="#fe6"/>
  </g>
  <text x="230" y="80" fill="#9ff" font-size="13" text-anchor="middle">MOONHOP</text>
  <!-- button row -->
  <g font-size="11" text-anchor="middle">
    <rect x="58"  y="262" width="62" height="30" rx="5" fill="#d0d0d0"/><text x="89"  y="281" fill="#000">THRUST</text>
    <rect x="128" y="262" width="62" height="30" rx="5" fill="#e8d000"/>
    <rect x="198" y="262" width="62" height="30" rx="5" fill="#1aa64a"/><text x="229" y="281" fill="#fff">START</text>
    <rect x="268" y="262" width="62" height="30" rx="5" fill="#2a63d6"/>
    <rect x="338" y="262" width="62" height="30" rx="5" fill="#d23a3a"/><text x="369" y="281" fill="#fff">BOOST</text>
  </g>
  <!-- tilt arrows -->
  <path d="M20,120 A210,210 0 0 1 60,40" fill="none" stroke="#9ff" stroke-width="3" marker-end="url(#a)"/>
  <path d="M440,120 A210,210 0 0 0 400,40" fill="none" stroke="#9ff" stroke-width="3" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#9ff"/></marker></defs>
  <!-- legend -->
  <g font-size="14" fill="#cfe">
    <text x="460" y="58" fill="#9ff" font-size="16">CONTROLS</text>
    <text x="460" y="88">Turn / tilt  rotate lander</text>
    <text x="460" y="114"><tspan fill="#d0d0d0">GRAY</tspan>  hold: thrust</text>
    <text x="460" y="140"><tspan fill="#ff6b6b">RED</tspan>   tap: emergency</text>
    <text x="460" y="158" font-size="11" fill="#9aa">      2.5x force, 4x fuel, 2 s</text>
    <text x="460" y="184"><tspan fill="#4cd27a">GREEN</tspan> start / confirm</text>
    <text x="460" y="210">D-pad L/R  rotate (backup)</text>
    <text x="460" y="230" font-size="12" fill="#9aa">D-pad centre: re-centre</text>
    <text x="460" y="256">PAGE 5 s   About</text>
    <text x="460" y="280">HOME 5 s   exit</text>
    <text x="460" y="306" font-size="12" fill="#ff8080">Never hold RED 6 s: power off</text>
  </g>
</svg>
